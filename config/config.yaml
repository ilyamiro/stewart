audio:
  stt:
    backend: whisper
    model: small
    strength: high
    beam_size: 5
    pause_threshold: 0.8
    vad_threshold: 0.5
    min_speech_duration: 0.25
    speaker-recognition: false
    speech-mode-restricted: false
  tts:
    enable: true
    enable-caching: true
    engine: kokoro
    speed: 1.0
    en:
      f: af_heart
      m: am_adam
      sex: m
      lang_code: a
    ru:
      f: baya
      m: aidar
      sex: m
      sample_rate: 24000
lang:
  name: english
  prefix: en
plugins:
  core:
    music-download: false
    usb-default:
    - linux foundation
    - webcam
    - network
    - finger
settings:
  animation: true
  inactivity-threshold: 300
  max-history-length: 100
  react-no-command: false
  text-mode: true
  trigger:
    trigger-mode: enabled
    trigger-time: 30
start-up:
  sound-enable: true
  sound-path: data/sounds/startup.wav
  voice-enable: true

router:
  mode: hybrid
  confidence_threshold: 0.50
  model:
    provider: agy
    fallback_to_algorithmic: true
  ollama:
    endpoint: http://localhost:11434
    model: llama3.2:1b
    timeout: 3.0
  agy:
    command: agy
    model: gemini-3.8-flash-low
    effort: low
    skill_name: stewart-voice
    timeout: 60.0
    dangerously_skip_permissions: true
  persona:
    enabled: true
    provider: agy
    skill_name: stewart-voice

telegram:
  enabled: true

mcp:
  enabled: true
  servers:
    life:
      command: bin/life-mcp
      args: []
    studieplus:
      command: bin/studieplus-mcp
      args: []
    gmail:
      command: bin/gmail-mcp
      args: []
    telegram:
      command: bin/telegram-mcp
      args: []
    calendar:
      command: bin/calendar-mcp
      args: []
    drive:
      command: bin/drive-mcp
      args: []
    github:
      command: bin/github-mcp
      args: []
    maps:
      command: bin/maps-mcp
      args: []
    youtube:
      command: bin/youtube-mcp
      args: []
    memory:
      command: bin/memory-mcp
      args: []
    streaming:
      command: bin/streaming-mcp
      args: []
